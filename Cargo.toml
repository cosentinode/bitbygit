[workspace]
members = [
    "crates/bitbygit",
    "crates/bitbygit-core",
    "crates/bitbygit-gh",
    "crates/bitbygit-git",
    "crates/bitbygit-store",
    "crates/bitbygit-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cosentinode/bitbygit"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
