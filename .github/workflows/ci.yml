name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Enable Linux recovery isolation
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test production recovery path
        env:
          BITBYGIT_REQUIRE_RECOVERY_SUCCESS: "1"
        run: |
          cargo test --locked -p bitbygit-git tests::exact_recovery_executes_every_supported_action -- --exact
          cargo test --locked -p bitbygit-tui tests::tui_reattaches_to_promoted_repository_after_recovery -- --exact

      - name: Build
        run: cargo build --locked --workspace
