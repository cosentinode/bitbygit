name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Test fail-closed recovery capabilities
        run: |
          cargo test --locked -p bitbygit-git tests::exact_recovery_fails_closed_before_creating_candidate -- --exact
          cargo test --locked -p bitbygit-git tests::capability_probe_enforces_deadline_and_output_bounds -- --exact

      - name: Build
        run: cargo build --locked --workspace
