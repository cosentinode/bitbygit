name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  minimum-rust:
    name: Rust 1.85 source build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Build release binary
        run: cargo build --locked --release -p bitbygit

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Validate release workflow
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/actionlint"
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          mkdir -p "${tool_dir}"
          curl -fsSLo "${tool_dir}/${archive}" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${tool_dir}/${archive}" | sha256sum -c -
          tar -C "${tool_dir}" -xzf "${tool_dir}/${archive}" actionlint
          "${tool_dir}/actionlint"
          bash scripts/test-release-workflow.sh

      - name: Validate Linux installation documentation
        shell: bash
        run: bash scripts/test-installation-docs.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build
        run: cargo build --locked --workspace

  installation-docs-macos:
    name: macOS installation docs
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate installation documentation
        shell: bash
        run: bash scripts/test-installation-docs.sh

  installation-docs-windows:
    name: Windows installation docs
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate installation documentation
        shell: pwsh
        run: ./scripts/test-installation-docs.ps1
